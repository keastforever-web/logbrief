[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logbrief-cli"
version = "0.1.0"
description = "Local, deterministic build-log summaries for humans and coding agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
logbrief = "logbrief:main"

[tool.setuptools]
py-modules = ["logbrief"]
